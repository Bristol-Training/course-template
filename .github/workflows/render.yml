# Renders the course and publishes the website to GitHub Pages.
#
#   push to main      render, check and publish
#   pull request      render and check only (nothing is published)
#   Run workflow      manual render and publish (Actions tab → Render course → Run workflow)
#
# The rendered files (attendee notes, slides, instructor guide) can be
# downloaded from each run's summary page under "Artifacts".
name: Render course

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      # R: only if the course has a DESCRIPTION file
      - if: hashFiles('DESCRIPTION') != ''
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - if: hashFiles('DESCRIPTION') != ''
        uses: r-lib/actions/setup-r-dependencies@v2

      # Python: only if the course has a requirements.txt file
      - if: hashFiles('requirements.txt') != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - if: hashFiles('requirements.txt') != ''
        run: pip install -r requirements.txt

      - name: Render
        run: bash scripts/render.sh all

      - name: Check
        run: bash scripts/check.sh

      - name: Upload course materials
        uses: actions/upload-artifact@v4
        with:
          name: course-materials
          path: build/*.html

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
