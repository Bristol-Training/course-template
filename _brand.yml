# Colours, logo, fonts and custom components shared by every page and the slides.
# Edit the palette below to re-colour the whole course.

meta:
  name: Jean Golding Institute

color:
  palette:
    purple: "#3d0251"
    lilac: "#b895ce"
    pale: "#f4eef8"
  primary: purple
  secondary: lilac
  link: purple

logo:
  images:
    uob:
      path: assets/UoB_RGB_24.png
      alt: University of Bristol logo
  medium: uob

typography:
  headings:
    color: purple
    weight: 700

defaults:
  bootstrap:
    defaults:
      # main content column ~25% wider than Quarto's default (800px)
      grid-body-width: 1250px
    # Custom components for the website pages (the slide versions are in _quarto.yml)
    rules: |
      // Fixed JGI colours (the cosmo theme would otherwise supply its own blue
      // for Bootstrap's $primary). Keep in step with the palette above.
      $jgi-purple: #3d0251;
      $jgi-lilac: #b895ce;
      $pale: #f4eef8;

      .callout.callout-style-default .callout-body { font-size: 1rem; }

      .cell-output {
        border-left: 0.25em solid $jgi-lilac;
        padding-left: 0.7em;
      }

      pre.sourceCode.bash { background-color: lightgray; }

      .code-with-filename .code-with-filename-file {
        background-color: lightslategray;
        &, & * {
          color: rgb(230, 230, 230) !important;
          font-weight: normal !important;
        }
      }

      /* question that opens each section */
      .lead-question {
        display: block;
        font-size: 1.35rem;
        font-style: italic;
        color: $jgi-purple;
        border-left: 0.3em solid $jgi-lilac;
        padding-left: 0.6em;
        margin: 0.5em 0 1em 0;
      }

      /* flow diagrams: a -> b -> c */
      .flow {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 0.35em;
        margin: 1em 0;
      }
      .flow .step {
        background: $jgi-purple;
        color: #fff;
        border-radius: 0.3em;
        padding: 0.25em 0.6em;
        font-family: var(--bs-font-monospace);
        font-size: 0.9rem;
      }
      .flow .step.light {
        background: $pale;
        color: $jgi-purple;
        border: 2px solid $jgi-purple;
      }
      .flow .arrow { color: $jgi-lilac; font-weight: 700; font-size: 1.2rem; }

      /* do / don't */
      .good, .bad {
        border-radius: 0.3em;
        padding: 0.3em 0.7em;
        margin: 0.4em 0;
      }
      .good { background: #e6f4ea; border-left: 0.3em solid #1e8e3e; }
      .bad { background: #fce8e6; border-left: 0.3em solid #c5221f; }

      /* cards */
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 0.6em;
        margin: 1em 0;
      }
      .card {
        background: $pale;
        border: none;
        border-top: 0.25em solid $jgi-purple;
        border-radius: 0.3em;
        padding: 0.5em 0.7em;
      }
      .card strong:first-child { display: block; color: $jgi-purple; }

      /* boxed side column on the home page */
      .course-sidebar {
        background: $pale;
        border: 2px solid $jgi-purple;
        border-radius: 0.6em;
        padding: 1.25em 1.5em;
      }
      .course-sidebar h3 {
        margin-top: 0;
        font-size: 1.25rem;
        color: $jgi-purple;
      }
      .course-sidebar h3:not(:first-child) { margin-top: 1.5em; }
      .course-sidebar .btn {
        display: block;
        width: 100%;
        margin-bottom: 0.75em;
        padding: 0.75em 1em;
      }
      /* buttons in JGI purple */
      .btn-primary {
        background-color: $jgi-purple;
        border-color: $jgi-purple;
        color: #fff;
        &:hover, &:focus, &:active {
          background-color: #5a1a72;
          border-color: #5a1a72;
          color: #fff;
        }
      }
      a { color: $jgi-purple; }
      a.btn { color: #fff; }
      .course-sidebar p { margin-bottom: 0; }
      .course-sidebar ul { padding-left: 1.2em; margin-bottom: 0; }
      .course-sidebar li { margin-bottom: 0.4em; }

      .big-statement {
        font-size: 1.4rem;
        font-weight: 700;
        color: $jgi-purple;
        text-align: center;
        margin: 1em 0;
      }
