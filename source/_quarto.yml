# Course settings shared by notes.qmd and slides.qmd.
# This is the main file to edit when starting a new course.

# Lets the settings below apply to every .qmd file in this folder
project:
  type: default

title: "Course Title"
subtitle: "Course notes"
author: "Jean Golding Institute"

# Set to true to put the instructor guide on the public website.
# It is always available as a download from the GitHub Actions run.
publish-instructor-guide: false

# Turns ::: {.instructor} blocks into instructor notes (see README.md)
filters:
  - filters/instructor.lua
